<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Moliya</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F1F9; --card:#FFFFFF; --tx:#1F1F2E; --tx2:#9B9BB4; --acc:#6C5CE7; --acc2:#8B7CF7;
  --grad:linear-gradient(133deg,#5B50D8 0%,#8B7CF7 100%);
  --green:#2FBF71; --greenbg:#E8F8F1; --red:#FF6B6B; --redbg:#FDECEC;
  --orange:#F5A623; --orangebg:#FDF3E3; --blue:#4D9FFF; --bluebg:#E9F3FF;
  --purplebg:#EFECFF; --chip:#EFEFF6; --line:#F1F1F8;
  --sh:0 10px 30px rgba(76,68,164,.07); --sh2:0 14px 34px rgba(76,68,164,.16);
  --r:20px; --r2:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--tx); font-size:15px; line-height:1.35;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
}
#app{max-width:430px;margin:0 auto;padding:14px 16px 130px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:8px 0 18px}
.hdr .eyebrow{font-size:12px;color:var(--tx2);font-weight:500;margin-bottom:3px}
.hdr h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.bell{width:46px;height:46px;border-radius:16px;background:var(--card);border:none;display:flex;
  align-items:center;justify-content:center;box-shadow:var(--sh);cursor:pointer;color:#4A4A63;flex:none}
.bell svg{width:21px;height:21px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}

/* --- Binafsha gradient kartalar --- */
.pcard{background:var(--grad);border-radius:24px;box-shadow:0 16px 34px rgba(91,80,216,.32);
  color:#fff;padding:22px;position:relative;overflow:hidden;margin-bottom:14px}
.pcard .lbl{font-size:13px;font-weight:500;color:rgba(255,255,255,.75)}
.pcard .amt{font-size:32px;font-weight:800;letter-spacing:-.5px;margin-top:14px}
.pcard .amt small{font-size:15px;font-weight:600;color:rgba(255,255,255,.85);margin-left:6px}
.pcard .badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);
  border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}
.pcard .badge svg{width:12px;height:12px}
.pcard .vs{font-size:12.5px;color:rgba(255,255,255,.72);margin-left:8px}
.pcard .eye{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:14px;
  background:rgba(255,255,255,.16);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pcard .eye svg{width:20px;height:20px;color:#fff}
.pcard .up-arr{position:absolute;top:22px;right:22px;width:54px;height:54px;color:#fff;opacity:.95}
.pcard .spark{position:absolute;left:0;right:0;bottom:0;height:74px;width:100%}
.pcard .foot{display:flex;align-items:center;margin-top:16px;position:relative;z-index:2}
.pcard .mini{padding:18px 20px}
.pcard .mini .amt{font-size:24px;margin-top:8px}
.pcard .mini .badge{margin-left:auto}

/* --- Daromad/Xarajat kichik kartalar --- */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.statc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;position:relative}
.statc .ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.statc .ic svg{width:19px;height:19px}
.statc .lb{font-size:12.5px;color:var(--tx2);font-weight:500}
.statc .vl{font-size:19px;font-weight:800;margin-top:3px}
.statc .pc{position:absolute;top:16px;right:14px;font-size:12px;font-weight:700}
.pc.up{color:var(--green)} .pc.down{color:var(--red)}

/* --- Ro'yxat elementlari --- */
.tlist{margin-top:6px}
.titem{display:flex;align-items:center;gap:12px;padding:13px 0;position:relative;border-bottom:1px solid var(--line)}
.titem:last-child{border-bottom:none}
.titem .ic{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.titem .ic svg{width:21px;height:21px}
.titem .mid{flex:1;min-width:0}
.titem .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .sb{font-size:12px;color:var(--tx2);margin-top:2px}
.titem .end{text-align:right}
.titem .sm{font-size:13.5px;font-weight:700;white-space:nowrap}
.titem .st{font-size:11px;color:var(--tx2);margin-top:3px}
.titem .st.inc{color:var(--green)}
.titem.swiped{background:#FBFAFF}
.titem .amt-plus{color:var(--green)}

/* --- Chip-lar --- */
.chips{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:14px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:none;background:var(--chip);color:#8A8FA3;font-size:13px;font-weight:600;
  padding:9px 16px;border-radius:20px;cursor:pointer;font-family:inherit;transition:all .15s}
.chip.on{background:var(--acc);color:#fff;box-shadow:0 6px 14px rgba(108,92,231,.35)}
.fbtn{flex:none;width:36px;height:36px;border-radius:12px;background:var(--chip);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6D7189;margin-left:2px}
.fbtn svg{width:16px;height:16px}

/* --- Analitika --- */
.seg{display:flex;background:#EAE9F3;border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:transparent;color:#8A8FA3;font-size:13.5px;font-weight:600;
  padding:10px 0;border-radius:13px;cursor:pointer;font-family:inherit;transition:all .18s}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 4px 12px rgba(76,68,164,.14)}
.donut-wrap{display:flex;align-items:center;gap:18px;margin-top:16px}
.donut{position:relative;width:148px;height:148px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .ctr b{font-size:18px;font-weight:800}
.donut .ctr span{font-size:11.5px;color:var(--tx2)}
.legend{flex:1;min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;padding:6px 0}
.legend .dot{width:9px;height:9px;border-radius:50%;flex:none}
.legend .ln{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .lv{font-size:13px;font-weight:700}
.insight{background:var(--purplebg);border-radius:var(--r);padding:16px;display:flex;gap:13px;
  align-items:flex-start;margin-bottom:14px}
.insight .ic{width:44px;height:44px;border-radius:14px;background:var(--acc);display:flex;
  align-items:center;justify-content:center;flex:none}
.insight .ic svg{width:20px;height:20px;color:#fff}
.insight b{font-size:14px;font-weight:700;display:block}
.insight p{font-size:13px;color:#7A76B5;margin-top:4px}
.card .chead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.card .chead .tt{font-size:16px;font-weight:700}
.card .chead .sb2{font-size:12.5px;color:var(--tx2);margin-top:2px}
.ibtn{width:40px;height:40px;border-radius:14px;background:var(--purplebg);border:none;color:var(--acc);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ibtn svg{width:18px;height:18px}
.bigbtn{width:100%;border:none;background:#EDEBFB;color:var(--acc);font-size:14px;font-weight:700;
  padding:15px;border-radius:var(--r2);cursor:pointer;font-family:inherit;margin-top:14px}

/* --- Operatsiyalar --- */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r2);
  padding:13px 16px;box-shadow:var(--sh);margin-bottom:12px}
.search svg{width:17px;height:17px;color:var(--tx2);flex:none}
.search input{flex:1;border:none;outline:none;background:transparent;font-family:inherit;
  font-size:14px;color:var(--tx)}
.search input::placeholder{color:#B4B4C8}
.dayh{display:flex;align-items:baseline;justify-content:space-between;margin:18px 4px 2px}
.dayh .d{font-size:15.5px;font-weight:700}
.dayh .n{font-size:12px;color:var(--tx2)}

/* --- Profil --- */
.pcard .prow{display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.stats3{display:flex;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:16px 6px;margin-bottom:14px}
.stats3 .c{flex:1;text-align:center;padding:0 4px}
.stats3 .c + .c{border-left:1px solid var(--line)}
.stats3 .v{font-size:17px;font-weight:800}
.stats3 .l{font-size:12px;color:var(--tx2);margin-top:3px}
.menu .mrow{display:flex;align-items:center;gap:13px;padding:12px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.menu .mrow:last-child{border-bottom:none}
.menu .mic{width:42px;height:42px;border-radius:14px;background:var(--purplebg);color:var(--acc);
  display:flex;align-items:center;justify-content:center;flex:none}
.menu .mic svg{width:19px;height:19px}
.menu .mt{flex:1}
.menu .mt b{font-size:14.5px;font-weight:600;display:block}
.menu .mt span{font-size:12px;color:var(--tx2);margin-top:2px;display:block}
.menu .chev{color:#C6C6D6;width:18px;height:18px;flex:none}
.ver{text-align:center;color:#B4B4C8;font-size:12.5px;margin:16px 0 4px}

/* --- Pastki navigatsiya + FAB --- */
.tabbar{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));
  background:var(--card);border-radius:26px;box-shadow:var(--sh2);display:flex;
  padding:10px 6px 12px;z-index:40}
.tab{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:#A7A8BD;cursor:pointer;font-family:inherit;padding:2px 0}
.tab svg{width:22px;height:22px}
.tab span{font-size:11px;font-weight:600}
.tab .dot{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px}
.tab.on{color:var(--acc)}
.tab.on .dot{background:var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:54px;height:54px;
  border-radius:19px;background:var(--grad);border:none;color:#fff;box-shadow:0 12px 26px rgba(91,80,216,.45);
  font-size:26px;font-weight:400;z-index:40;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* --- Bottom sheet / overlay / toast --- */
.overlay{position:fixed;inset:0;background:rgba(22,18,52,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:10px;right:10px;bottom:0;background:var(--card);
  border-radius:24px 24px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom));
  z-index:70;transform:translateY(105%);transition:transform .26s cubic-bezier(.3,.8,.35,1);max-height:88%;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:#E3E3EE;margin:0 auto 14px}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--tx2);margin-bottom:14px}
.srow{display:flex;align-items:center;gap:13px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.srow:last-child{border-bottom:none}
.srow svg{width:20px;height:20px}
.srow.danger,.srow.danger svg{color:var(--red)}
.srow b{flex:1;font-size:15px;font-weight:600}
.form{margin-top:8px}
.form label{font-size:12.5px;color:var(--tx2);font-weight:600;display:block;margin:14px 0 7px}
.form label:first-child{margin-top:4px}
.form input[type=text],.form input[type=number],.form input[type=date]{width:100%;border:1.5px solid #E7E7F1;
  background:#FAFAFE;border-radius:var(--r2);padding:13px 14px;font-family:inherit;font-size:15px;color:var(--tx);outline:none}
.form input:focus{border-color:var(--acc2)}
.tsel{display:flex;gap:8px}
.tsel button{flex:1;border:1.5px solid #E7E7F1;background:#FAFAFE;border-radius:var(--r2);padding:11px;
  font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:#8A8FA3}
.tsel button.on.exp{background:var(--redbg);border-color:var(--red);color:var(--red)}
.tsel button.on.inc{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.kgrid{display:flex;flex-wrap:wrap;gap:8px}
.kgrid button{border:1.5px solid #E7E7F1;background:#FAFAFE;border-radius:18px;padding:8px 13px;
  font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:#5B5B77;display:flex;align-items:center;gap:6px}
.kgrid button.on{background:var(--purplebg);border-color:var(--acc);color:var(--acc)}
.kgrid svg{width:14px;height:14px}
.formbtns{display:flex;gap:10px;margin-top:20px}
.formbtns .save{flex:1;border:none;background:var(--acc);color:#fff;font-family:inherit;font-size:14.5px;
  font-weight:700;padding:14px;border-radius:var(--r2);cursor:pointer}
.formbtns .del{flex:1;border:none;background:var(--redbg);color:var(--red);font-family:inherit;
  font-size:14.5px;font-weight:700;padding:14px;border-radius:var(--r2);cursor:pointer}
.formbtns .cancel{flex:1;border:none;background:#EFEFF6;color:#6D7189;font-family:inherit;font-size:14.5px;
  font-weight:700;padding:14px;border-radius:var(--r2);cursor:pointer}
.langopt{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;
  border-bottom:1px solid var(--line);cursor:pointer}
.langopt:last-child{border-bottom:none}
.langopt b{font-size:15px;font-weight:600}
.langopt .sel{width:22px;height:22px;border-radius:50%;background:var(--acc);display:none;
  align-items:center;justify-content:center;color:#fff}
.langopt.on .sel{display:flex}
.langopt .sel svg{width:12px;height:12px}
.empty{padding:34px 10px;text-align:center;color:var(--tx2)}
.empty svg{width:52px;height:52px;color:#D8D8E6;margin-bottom:12px}
.empty b{font-size:15px;color:var(--tx);display:block;margin-bottom:5px}
.empty p{font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(110px + env(safe-area-inset-bottom));
  background:#2B2B3D;color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:16px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:90;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pagesec{display:none}
.pagesec.on{display:block}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between}
.pagetl .eyebrow{font-size:12px;color:var(--tx2);font-weight:500;margin-bottom:3px}
.pagetl h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.hidden{display:none!important}
</style>
</head>

<body>
<div id="app">
  <section class="pagesec on" id="pg-home"></section>
  <section class="pagesec" id="pg-analytics"></section>
  <section class="pagesec" id="pg-ops"></section>
  <section class="pagesec" id="pg-profile"></section>
</div>
<button class="fab" id="fabBtn">+</button>
<nav class="tabbar" id="tabbar"></nav>
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

/* --- Summalar --- */
function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," "); }
function short(n){
  n = Math.abs(Math.round(n));
  if (n >= 1e6){ let v = n/1e6; v = Math.round(v*10)/10;
    return (v % 1 === 0 ? v.toFixed(0) : v.toFixed(1).replace(".",",")) + " " + t("mln"); }
  if (n >= 1e3) return Math.round(n/1e3) + " " + t("ming");
  return fmt(n);
}
function fmtSigned(x){ return (x > 0 ? "+" : x < 0 ? "-" : "") + fmt(Math.abs(x)); }

/* --- Sanalar --- */
function dstr(d){ const dt = new Date(d+"T00:00:00"); return dt; }
function todayStr(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(s, n){ const d = dstr(s); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayLabel(s){
  const b = todayStr();
  if (s === b) return t("today");
  if (s === addDays(b, -1)) return t("yesterday");
  const dt = dstr(s);
  return dt.getDate() + (S.lang==="ru" ? " " : "-") + t("months")[dt.getMonth()];
}
function monthName(i){ return t("months")[i]; }

/* --- Sana oralig'i --- */
function periodRange(p){
  const b = todayStr(); const d = dstr(b);
  if (p === "week") return [addDays(b,-6), b];
  if (p === "year") return [b.slice(0,4)+"-01-01", b];
  return [new Date(d.getFullYear(), d.getMonth(), 1).getFullYear()+"-"+String(new Date(d.getFullYear(), d.getMonth(), 1).getMonth()+1).padStart(2,"0")+"-01", b];
}
function prevRange(p){ const [a] = periodRange(p); const len = Math.round((dstr(periodRange(p)[1]) - dstr(a))/86400000)+1; return [addDays(a, -len), addDays(a,-1)]; }

async function api(url, method, body){
  const auth = tg && tg.initData ? tg.initData : "";
  const opt = { method, headers: { "Authorization": "tma " + auth } };
  if (body !== undefined){ opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw Object.assign(new Error(d.xato||"err"), {status:r.status, sabab:d.sabab||"", diag:d.diag||null});
  return d;
}

async function load(){
  try{
    const d = await api("/api/me", "POST", {});
    S.lang = d.lang; S.user = d.user; S.tx = d.yozuvlar || [];
    S.cats = d.kategoriyalar || {};
    document.documentElement.lang = S.lang;
    renderAll();
  }catch(e){
    if (e.status === 401){
      S._diag = e.diag || null;
      $("pg-home").innerHTML = authErrHtml(e.sabab || "");
      $("tabbar").classList.add("hidden"); $("fabBtn").classList.add("hidden");
    } else {
      $("pg-home").innerHTML = errHtml();
      $("tabbar").classList.add("hidden"); $("fabBtn").classList.add("hidden");
    }
  }
}

function pctChange(cur, prev){
  if (!prev) return null;
  return Math.round((cur - prev) / Math.abs(prev) * 1000) / 10;
}
function txIn(a, b){ return S.tx.filter(y => y.sana >= a && y.sana <= b); }
function inPeriod(p){ const [a,b] = periodRange(p); return txIn(a,b); }
function inPrevPeriod(p){ const [a,b] = prevRange(p); return txIn(a,b); }

/* ============================ EKRAN: ANALITIKA ============================ */
function sparkPath(vals, w, h){
  if (vals.length < 2) return "";
  const max = Math.max(...vals), min = Math.min(...vals), rng = (max-min)||1;
  const pts = vals.map((v,i)=>[i/(vals.length-1)*w, h-4-((v-min)/rng)*(h-12)]);
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i=1;i<pts.length;i++){
    const [x1,y1] = pts[i-1], [x2,y2] = pts[i];
    const mx = ((x1+x2)/2).toFixed(1);
    d += ` C${mx},${y1.toFixed(1)} ${mx},${y2.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
  }
  return d;
}
function donutData(p){
  const list = inPeriod(p).filter(y=>y.turi==="expense");
  const by = {};
  list.forEach(y=>{ by[y.kategoriya] = (by[y.kategoriya]||0)+y.summa; });
  let arr = Object.entries(by).map(([k,v])=>({k, v})).sort((a,b)=>b.v-a.v);
  if (arr.length > 4){ const rest = sumOf(arr.slice(4)); arr = arr.slice(0,4); arr.push({k:"other_expense", v:rest, other:true}); }
  return arr;
}
function renderAnalytics(){
  const p = S.period;
  const [a,b] = periodRange(p);
  const cur = inPeriod(p), prev = inPrevPeriod(p);
  const bal = sumOf(cur.filter(y=>y.turi==="income")) - sumOf(cur.filter(y=>y.turi==="expense"));
  const balP = sumOf(prev.filter(y=>y.turi==="income")) - sumOf(prev.filter(y=>y.turi==="expense"));
  const pct = pctChange(bal, balP);
  // sparkline: davr ichidagi kumulyativ balans
  const daysN = Math.round((dstr(b)-dstr(a))/86400000)+1;
  const step = daysN>70 ? "month" : "day";
  const pts = []; let run = 0;
  if (step === "day"){ const map={}; cur.forEach(y=>map[y.sana]=(map[y.sana]||0)+(y.turi==="income"?y.summa:-y.summa));
    for(let i=0;i<daysN;i++){ run += map[addDays(a,i)]||0; pts.push(run); } }
  else { const map={}; cur.forEach(y=>{ const k=y.sana.slice(0,7); map[k]=(map[k]||0)+(y.turi==="income"?y.summa:-y.summa); });
    for(let i=0;i<12;i++){ const k=a.slice(0,4)+"-"+String(i+1).padStart(2,"0"); if (k<=b.slice(0,7)) { run += map[k]||0; pts.push(run); } } }
  const segs = donutData(p);
  const total = sumOf(segs.map(s=>s.v));
  let off = 0; const R = 62, C = 2*Math.PI*R;
  const arcs = segs.map(s=>{
    const frac = total? s.v/total : 0;
    const arc = `<circle r="${R}" cx="74" cy="74" fill="none" stroke="${catColor(s.k)}" stroke-width="17"
      stroke-dasharray="${(frac*C-2).toFixed(1)} ${(C-frac*C+2).toFixed(1)}" stroke-dashoffset="${(-off*C).toFixed(1)}" stroke-linecap="round"/>`;
    off += frac; return arc;
  }).join("");
  // insight
  const e = sumOf(cur.filter(y=>y.turi==="expense")), eP = sumOf(prev.filter(y=>y.turi==="expense"));
  const dPct = pctChange(e, eP);
  let ins = "";
  if (eP > 0 && dPct !== null && dPct !== 0){
    const down = dPct < 0;
    let ref = p==="week" ? t("ref_week") : p==="year" ? t("ref_year") : (S.lang==="ru" ? "в " + t("months_gen")[dstr(prevRange("month")[1]).getMonth()] : t("ref_month"));
    ins = `<div class="insight"><div class="ic">${ICONS.bars}</div><div>
      <b>${esc(tpl(down?"ins_down":"ins_up",{p:Math.abs(dPct)}))}</b>
      <p>${esc(tpl(down?"ins_down_sub":"ins_up_sub",{d:fmt(Math.abs(e-eP)), ref}))}</p></div></div>`;
  }
  $("pg-analytics").innerHTML = `
    <div class="hdr">
      <div class="pagetl"><div class="eyebrow">${esc(t("a_eyebrow"))}</div><h1>${esc(t("a_title"))}</h1></div>
      <button class="bell" onclick="openNotif()">${ICONS.bell}</button>
    </div>
    <div class="seg" id="segP">${["week","month","year"].map(v=>`<button data-p="${v}" class="${p===v?"on":""}">${esc(t(v))}</button>`).join("")}</div>
    <div class="pcard" style="min-height:210px">
      <div class="lbl">${esc(t("a_bal"))}</div>
      <div style="position:relative;z-index:2">
        <div class="amt">${(bal>=0?"+":"−")+fmt(Math.abs(bal))}<small>${t("som")}</small></div>
        <div style="margin-top:10px;font-size:12.5px;color:rgba(255,255,255,.72)">
          ${pct===null?"":(Math.abs(pct)+"% "+(pct>=0?t("growth"):t("decline")))}</div>
      </div>
      <svg class="up-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      <svg class="spark" viewBox="0 0 320 74" preserveAspectRatio="none">
        <path d="${sparkPath(pts,320,74)} L320,74 L0,74 Z" fill="rgba(255,255,255,.10)"/>
        <path d="${sparkPath(pts,320,74)}" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="card">
      <div class="chead">
        <div><div class="tt">${esc(t("donut_title"))}</div><div class="sb2">${esc(tpl("donut_sub",{s:fmt(total)+" "+t("som")}))}</div></div>
        <button class="ibtn" onclick="openPeriodSheet()">${ICONS.calendar}</button>
      </div>
      ${total ? `<div class="donut-wrap">
        <div class="donut"><svg>${arcs}</svg>
          <div class="ctr"><b>${short(total)}</b><span>${esc(t("expenses_word"))}</span></div></div>
        <div class="legend">${segs.map(s=>`<div class="li"><span class="dot" style="background:${catColor(s.k)}"></span>
          <span class="ln">${esc(catName(s.k))}</span><span class="lv">${fmt(s.v)}</span></div>`).join("")}</div>
      </div>` : `<div class="empty" style="padding:24px">${esc(t("donut_empty"))}</div>`}
    </div>
    ${ins}`;
  $("segP").querySelectorAll("button").forEach(b=>{
    b.onclick = () => { S.period = b.dataset.p; haptic("light"); renderAnalytics(); };
  });
}

function bindLongPress(box){
  if (!box) return;
  let tmr = null, sx = 0, target = null;
  box.addEventListener("touchstart", e => {
    const it = e.target.closest(".titem"); if (!it) return;
    target = it; sx = e.touches[0].clientX;
    tmr = setTimeout(() => { tmr = null; haptic("medium"); openAction(target.dataset.id); }, 450);
  }, {passive:true});
  box.addEventListener("touchmove", e => {
    if (tmr && Math.abs(e.touches[0].clientX - sx) > 40){ clearTimeout(tmr); tmr = null; }
  }, {passive:true});
  box.addEventListener("touchend", () => { if (tmr){ clearTimeout(tmr); tmr = null; } });
  box.addEventListener("contextmenu", e => {
    const it = e.target.closest(".titem");
    if (it){ e.preventDefault(); openAction(it.dataset.id); }
  });
}

  const payload = {
    turi: S.formType,
    kategoriya: S._selKat ? S._selKat() : null,
    summa,
    izoh: $("fIzoh").value.trim(),
    sana: $("fSana").value || todayStr(),
  };
  try{
    if (S.editId) await api("/api/transactions/"+S.editId, "PATCH", payload);
    else await api("/api/transactions", "POST", payload);
    haptic("ok"); closeSheet(); toast(t("saved")); await load();
  }catch(e){ toast(t("err")); }
}

/* ============================ TABLAR + ISHGA TUSHIRISH ============================ */
const TABS = [["home","nav_home","home"],["analytics","nav_analytics","chart"],["ops","nav_ops","list"],["profile","nav_profile","person"]];
let curTab = "home";
function renderTabbar(){
  $("tabbar").innerHTML = TABS.map(([id,lk,ic])=>
    `<button class="tab ${curTab===id?"on":""}" data-t="${id}">${ICONS[ic]}<span>${esc(t(lk))}</span><span class="dot"></span></button>`).join("");
  $("tabbar").querySelectorAll(".tab").forEach(b=>{ b.onclick = () => go(b.dataset.t); });
}
function go(tab, focusQ){
  curTab = tab; haptic("light");
  document.querySelectorAll(".pagesec").forEach(s=>s.classList.remove("on"));
  $("pg-"+tab).classList.add("on");
  renderTabbar();
  if (tab === "home") renderHome();
  if (tab === "analytics") renderAnalytics();
  if (tab === "ops"){ renderOps(); if (focusQ){ const q=$("opsQ"); if (q) setTimeout(()=>q.focus(), 60); } }
  if (tab === "profile") renderProfile();
  window.scrollTo({top:0});
}
function renderAll(){ renderTabbar(); go(curTab); }
try{
  if (tg){
    tg.ready(); tg.expand();
    tg.setHeaderColor && tg.setHeaderColor("#F2F1F9");
    tg.setBackgroundColor && tg.setBackgroundColor("#F2F1F9");
    if (tg.BackButton) tg.BackButton.onClick(() => { if (sheetOpen) closeSheet(); });
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
  }
}catch(e){}
$("overlay").onclick = () => { if (sheetOpen) closeSheet(); };
$("fabBtn").onclick = () => { haptic("medium"); openForm(null); };
load();
</script>
